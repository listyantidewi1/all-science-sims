server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # aset statis di-cache panjang karena Vite sudah kasih hash di nama file-nya
    location ~* \.(js|css|svg|png|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # semua route dikembalikan ke index.html — wajib buat SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
